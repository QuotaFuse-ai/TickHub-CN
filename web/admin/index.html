<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>TickHub-CN 管理控制台</title>
<style>
  :root {
    color-scheme: light;
    --fg: #1d2430; --muted: #5b6675; --line: #d8dee8; --bg: #fff;
    --accent: #0b63c5; --ok: #12805c; --warn: #b25e09; --bad: #b42318;
    --soft: #f4f6fa;
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --fg: #e6eaf0; --muted: #9aa6b5; --line: #33404f; --bg: #151b23;
    --accent: #6fb0ff; --ok: #4ad6a4; --warn: #f0a44a; --bad: #ff8a7a;
    --soft: #1c242e;
  }
  /* Theme toggle is applied by script; this keeps a no-JS page dark-aware. */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme]) {
      color-scheme: dark;
      --fg: #e6eaf0; --muted: #9aa6b5; --line: #33404f; --bg: #151b23;
      --accent: #6fb0ff; --ok: #4ad6a4; --warn: #f0a44a; --bad: #ff8a7a;
      --soft: #1c242e;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; flex-direction: column;
         background: var(--bg); color: var(--fg);
         font: 14px/1.55 system-ui, "Segoe UI", "Microsoft YaHei", sans-serif; }
  a { color: var(--accent); }
  header { position: sticky; top: 0; z-index: 5; display: flex; flex-wrap: wrap; gap: 8px 12px;
           align-items: center; justify-content: space-between; padding: 10px 20px;
           border-bottom: 1px solid var(--line); background: var(--bg); }
  header h1 { margin: 0; font-size: 17px; white-space: nowrap; }
  header .spacer { flex: 1; }
  .badge { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px;
           border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
  .badge.ok { color: var(--ok); border-color: var(--ok); }
  .badge.warn { color: var(--warn); border-color: var(--warn); }
  .badge.bad { color: var(--bad); border-color: var(--bad); }
  .layout { display: grid; grid-template-columns: 190px minmax(0, 1fr); flex: 1;
            align-items: start; min-height: 0; }
  nav { padding: 14px 10px; border-right: 1px solid var(--line); }
  nav a { display: block; padding: 7px 10px; border-radius: 7px; text-decoration: none;
          color: var(--fg); font-size: 13.5px; }
  nav a:hover { background: var(--soft); }
  nav a.active { background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--accent); font-weight: 600; }
  main { padding: 20px 24px 56px; max-width: 1280px; }
  h2 { font-size: 19px; margin: 0 0 2px; }
  p.sub { margin: 0 0 18px; color: var(--muted); }
  h3 { font-size: 15px; margin: 24px 0 8px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 18px; }
  .card { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
  .card .k { font-size: 12px; color: var(--muted); }
  .card .v { font-size: 21px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .row { display: flex; flex-wrap: wrap; gap: 10px 12px; align-items: flex-end; margin: 12px 0; }
  label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); min-width: 0; }
  input, select, textarea, button { font: inherit; padding: 7px 9px; border: 1px solid var(--line);
          border-radius: 7px; background: transparent; color: var(--fg); }
  input, select, button { height: 34px; }
  select { padding-right: 22px; }
  textarea { width: 100%; min-height: 380px; font-family: ui-monospace, Consolas, monospace; font-size: 12.5px; }
  button { cursor: pointer; padding-inline: 14px; }
  button:hover:not([disabled]) { border-color: var(--accent); }
  button.primary:hover:not([disabled]) { filter: brightness(1.08); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.danger { color: var(--bad); border-color: var(--bad); }
  button[disabled] { opacity: .5; cursor: not-allowed; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 6px 9px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; background: var(--bg); white-space: nowrap; }
  tbody tr:hover { background: var(--soft); }
  td { font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
  .scroll { overflow-x: auto; }
  pre { overflow: auto; padding: 12px; border: 1px solid var(--line); border-radius: 8px;
        background: var(--soft); font-size: 12px; max-height: 460px; }
  .muted { color: var(--muted); }
  .err { color: var(--bad); white-space: pre-wrap; }
  .ok { color: var(--ok); }
  #toast { position: fixed; right: 18px; bottom: 18px; z-index: 30; max-width: min(460px, calc(100vw - 36px));
           padding: 10px 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--soft);
           box-shadow: 0 6px 20px rgba(0,0,0,.18); display: none; white-space: pre-wrap; }
  .empty { padding: 14px; border: 1px dashed var(--line); border-radius: 8px; color: var(--muted); }
  #search { width: min(260px, 46vw); }
  #hits[hidden], tbody tr[hidden] { display: none; }
  kbd { padding: 1px 6px; border: 1px solid var(--line); border-bottom-width: 2px;
        border-radius: 5px; background: var(--soft); font: 12px ui-monospace, Consolas, monospace; }
  .codes { margin: 6px 0 0; padding-left: 18px; color: var(--muted); font-size: 12.5px; }
  dialog { max-width: min(760px, calc(100vw - 32px)); max-height: 80vh; overflow: auto;
           padding: 18px 22px; border: 1px solid var(--line); border-radius: 12px;
           background: var(--bg); color: var(--fg); box-shadow: 0 18px 48px rgba(0,0,0,.3); }
  dialog::backdrop { background: rgba(0,0,0,.45); }
  dialog h3 { margin-top: 4px; }
  dialog form { margin-top: 14px; text-align: right; }
  details summary { cursor: pointer; color: var(--muted); }
  .split { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 18px; }
  .kv { display: grid; grid-template-columns: minmax(140px, 240px) minmax(0, 1fr); gap: 2px 14px; font-size: 13px; }
  .kv dt { color: var(--muted); overflow-wrap: anywhere; }
  .kv dd { margin: 0; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
  @media (max-width: 760px) {
    .layout { grid-template-columns: 1fr; }
    nav { display: flex; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--line); }
    nav a { white-space: nowrap; }
    main { padding: 16px 16px 48px; }
    header { padding: 10px 14px; }
  }
</style>
</head>
<body>
<header>
  <h1>TickHub-CN 管理控制台</h1>
  <span id="version" class="badge">未连接</span>
  <span id="ro" class="badge" hidden></span>
  <label style="flex-direction:row;align-items:center;gap:6px;white-space:nowrap;">
    搜索
    <input id="search" type="search" placeholder="过滤当前页表格（Ctrl+K）" autocomplete="off" />
  </label>
  <span id="hits" class="badge" hidden></span>
  <span class="spacer"></span>
  <button id="export" type="button" title="导出当前页表格为 CSV（Ctrl+E）">导出</button>
  <button id="theme" type="button" title="切换主题：自动 / 浅色 / 深色（Ctrl+J）">主题：自动</button>
  <button id="shortcut-button" type="button" title="快捷键与错误码释义（?）" aria-label="快捷键与错误码释义">?</button>
  <label style="flex-direction:row;align-items:center;gap:6px;white-space:nowrap;">
    管理令牌
    <input id="token" type="password" autocomplete="off" placeholder="ADMIN_AUTH_TOKEN（本机可留空）" style="width:min(230px,45vw);" />
  </label>
  <button id="connect" class="primary" type="button">连接</button>
</header>

<div class="layout">
  <nav id="nav">
    <a href="#/dashboard" data-route="dashboard">概览</a>
    <a href="#/sources" data-route="sources">数据源健康</a>
    <a href="#/cache" data-route="cache">缓存</a>
    <a href="#/proxy" data-route="proxy">代理池</a>
    <a href="#/fieldmap" data-route="fieldmap">字段映射</a>
    <a href="#/mcp" data-route="mcp">MCP 调试</a>
    <a href="#/data" data-route="data">数据核查</a>
    <a href="#/crawler" data-route="crawler">抓取任务</a>
    <a href="#/logs" data-route="logs">日志</a>
    <a href="#/config" data-route="config">运行配置</a>
    <a href="#/audit" data-route="audit">审计</a>
  </nav>
  <main id="view"></main>
</div>

<div id="toast" role="status" aria-live="polite"></div>

<dialog id="shortcuts" aria-labelledby="shortcuts-title">
  <h2 id="shortcuts-title" style="font-size:16px;">快捷键</h2>
  <div id="shortcut-list"></div>
  <h3>错误码释义</h3>
  <p class="muted" style="margin:0 0 8px;">后端返回的 <code>QFSD-xxxx</code> 在提示与结果里会附带这里的解释。</p>
  <div id="code-list"></div>
  <form method="dialog"><button type="submit" class="primary">关闭</button></form>
</dialog>

<script>
"use strict";

/* ---------------------------------------------------------------- state */

const state = {
  token: sessionStorage.getItem("tickhub_admin_token") || "",
  readonly: null,
  status: null,
  tools: null,
  toolsView: null,
  mcpLayer: "",
  theme: localStorage.getItem("tickhub_admin_theme") || "auto",
};

const $ = (sel) => document.querySelector(sel);

/* -------------------------------------------------------------- helpers */

function esc(value) {
  if (value === null || value === undefined) return "<span class='muted'>—</span>";
  if (typeof value === "object") return esc(JSON.stringify(value));
  return String(value).replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
  })[c]);
}

function boolBadge(flag, good = "正常", bad = "异常") {
  return flag ? `<span class="badge ok">${esc(good)}</span>` : `<span class="badge bad">${esc(bad)}</span>`;
}

/* ---------------------------------------------------------- error codes */

// Mirrors ERROR_CODES in src/tickhub_cn/core/errors.py (a UI test keeps them equal).
const ERROR_CODES = {
  "QFSD-1001": ["数据源超时", "切换备用源"],
  "QFSD-1002": ["数据源空数据", "切源或返回空并标记"],
  "QFSD-2001": ["Redis 不可用", "降级直连并告警"],
  "QFSD-3001": ["字段映射配置错误", "回退全字段并告警"],
  "QFSD-4001": ["财报勾稽失败", "标记 fail，阻断脏数据"],
  "QFSD-5001": ["代理全池失效", "降级直连并告警"],
  "QFSD-6001": ["Admin 鉴权失败", "拒绝并审计"],
  "QFSD-7001": ["限流命中", "返回重试建议"],
  "QFSD-8001": ["批量部分失败", "返回成功/失败列表"],
  "QFSD-9001": ["参数错误", "修正参数"],
  "QFSD-9002": ["当前数据源不支持该能力", "查看降级说明"],
  "QFSD-9003": ["数据源返回异常", "重试或切源"],
  "QFSD-9004": ["需要鉴权或 API Key", "配置密钥"],
  "QFSD-9005": ["未找到数据", "确认代码/日期"],
};

function codeNotes(text) {
  const seen = [];
  for (const match of String(text === undefined || text === null ? "" : text).matchAll(/QFSD-\d{4}|QF-\d{4}/g)) {
    const code = match[0].startsWith("QF-") ? "QFSD-" + match[0].slice(3) : match[0];
    if (!seen.includes(code)) seen.push(code);
  }
  return seen.map((code) => {
    const meta = ERROR_CODES[code] || ["未知错误码", "查看服务端日志"];
    return `${code} ${meta[0]} → ${meta[1]}`;
  });
}

function explain(text) {
  const body = String(text === undefined || text === null ? "" : text);
  const notes = codeNotes(body);
  return notes.length ? `${body}\n错误码释义：\n${notes.join("\n")}` : body;
}

function codeHelpHtml(text) {
  const notes = codeNotes(text);
  if (!notes.length) return "";
  return `<ul class="codes">${notes.map((note) => `<li>${esc(note)}</li>`).join("")}</ul>`;
}

function toast(message, isError) {
  const box = $("#toast");
  box.textContent = isError ? explain(message) : message;
  box.classList.toggle("err", Boolean(isError));
  box.style.display = "block";
  clearTimeout(toast._t);
  toast._t = setTimeout(() => { box.style.display = "none"; }, isError ? 8000 : 3500);
}

async function api(path, options = {}) {
  const headers = Object.assign({ Accept: "application/json" }, options.headers || {});
  if (options.body !== undefined) headers["Content-Type"] = "application/json";
  if (state.token) headers["X-Admin-Token"] = state.token;

  const response = await fetch(path, Object.assign({}, options, { headers, credentials: "same-origin" }));
  let payload = null;
  try { payload = await response.json(); } catch (_) { /* non-JSON body */ }

  if (response.status === 401) {
    setConnected(false);
    throw new Error("鉴权失败（401）：请在顶部填写 ADMIN_AUTH_TOKEN");
  }
  if (!response.ok) {
    const detail = payload && payload.detail !== undefined ? payload.detail
                 : payload && payload.error ? payload.error
                 : payload;
    throw Object.assign(new Error(typeof detail === "string" ? detail : JSON.stringify(detail)), {
      status: response.status, payload,
    });
  }
  return payload;
}

function post(path, body) {
  return api(path, { method: "POST", body: JSON.stringify(body || {}) });
}

function table(rows, columns) {
  if (!Array.isArray(rows) || !rows.length) return "<p class='empty'>没有记录。</p>";
  const keys = columns || (() => {
    const out = [];
    for (const row of rows) {
      if (row && typeof row === "object") for (const k of Object.keys(row)) if (!out.includes(k)) out.push(k);
    }
    return out;
  })();
  if (!keys.length) return `<pre>${esc(JSON.stringify(rows, null, 2))}</pre>`;

  const body = rows.slice(0, 500).map((row) =>
    `<tr>${keys.map((k) => `<td>${esc(row ? row[k] : "")}</td>`).join("")}</tr>`).join("");
  const more = rows.length > 500 ? `<p class="muted">仅显示前 500 / ${rows.length} 行。</p>` : "";
  return `<div class="scroll"><table><thead><tr>${keys.map((k) => `<th>${esc(k)}</th>`).join("")}</tr></thead>
    <tbody>${body}</tbody></table></div>${more}`;
}

function kv(rows) {
  if (!Array.isArray(rows) || !rows.length) return "<p class='empty'>没有记录。</p>";
  const items = rows.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("");
  return `<dl class="kv">${items}</dl>`;
}

function cards(items) {
  return `<div class="cards">${items.map(([k, v, cls]) =>
    `<div class="card"><div class="k">${esc(k)}</div><div class="v ${cls || ""}">${esc(v)}</div></div>`).join("")}</div>`;
}

function pre(value) {
  return `<pre>${esc(typeof value === "string" ? value : JSON.stringify(value, null, 2))}</pre>`;
}

function writeButton(label, action, extra = "", cls = "primary") {
  const disabled = state.readonly ? "disabled" : "";
  return `<button type="button" class="${cls}" data-action="${esc(action)}" ${disabled}>${esc(label)}</button>${extra}`;
}

function guardReadonly() {
  if (state.readonly) {
    toast("控制台处于只读模式（ADMIN_READONLY=true），写操作已禁用", true);
    return false;
  }
  return true;
}

async function runAction(button, fn) {
  const original = button.textContent;
  button.disabled = true;
  try { await fn(); }
  catch (exc) { toast(exc.message || String(exc), true); }
  finally { button.textContent = original; button.disabled = Boolean(state.readonly); }
}

/* -------------------------------------------------------------- search */

function applySearch() {
  const query = $("#search").value.trim().toLowerCase();
  const hits = $("#hits");
  let total = 0;
  let shown = 0;

  document.querySelectorAll("#view table").forEach((table) => {
    table.querySelectorAll("tbody tr").forEach((row) => {
      total += 1;
      const hit = !query || row.textContent.toLowerCase().includes(query);
      row.hidden = !hit;
      if (hit) shown += 1;
    });
  });

  if (!query) {
    hits.hidden = true;
    hits.textContent = "";
    return;
  }
  hits.hidden = false;
  if (!total) {
    hits.textContent = "当前页无表格";
    hits.className = "badge";
    return;
  }
  hits.textContent = `匹配 ${shown} / ${total} 行`;
  hits.className = "badge " + (shown ? "ok" : "warn");
}

/* -------------------------------------------------------------- export */

function csvCell(value) {
  const text = value === undefined || value === null ? "" : String(value);
  return /[",\r\n]/.test(text) ? `"${text.replace(/"/g, '""')}"` : text;
}

function download(name, text) {
  const url = URL.createObjectURL(new Blob([text], { type: "text/csv;charset=utf-8" }));
  const link = document.createElement("a");
  link.href = url;
  link.download = name;
  document.body.appendChild(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  toast(`已导出 ${name}`);
}

function exportView() {
  const route = currentRoute();
  const view = $("#view");
  const tables = [...view.querySelectorAll("table")];
  const lines = [`# TickHub-CN 管理控制台 / ${route} / ${new Date().toISOString()}`];

  tables.forEach((table, index) => {
    lines.push(`# 表 ${index + 1}`);
    const header = table.querySelector("thead tr");
    if (header) lines.push([...header.children].map((th) => csvCell(th.textContent)).join(","));
    table.querySelectorAll("tbody tr").forEach((row) => {
      if (row.hidden) return;  // exported rows honour the active search
      lines.push([...row.children].map((td) => csvCell(td.textContent)).join(","));
    });
  });

  if (!tables.length) {
    const text = view.innerText.trim();
    if (!text) { toast("当前页没有可导出的内容", true); return; }
    lines.push(csvCell(text));
  }

  const now = new Date();
  const pad = (n) => String(n).padStart(2, "0");
  const stamp = `${now.getFullYear()}${pad(now.getMonth() + 1)}${pad(now.getDate())}-`
    + `${pad(now.getHours())}${pad(now.getMinutes())}${pad(now.getSeconds())}`;
  download(`tickhub-${route}-${stamp}.csv`, "\ufeff" + lines.join("\r\n"));
}

/* --------------------------------------------------------------- theme */

const THEMES = ["auto", "light", "dark"];
const THEME_LABELS = { auto: "主题：自动", light: "主题：浅色", dark: "主题：深色" };

function resolveTheme(pref) {
  if (pref === "light" || pref === "dark") return pref;
  return window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
}

function applyTheme(pref) {
  state.theme = THEMES.includes(pref) ? pref : "auto";
  localStorage.setItem("tickhub_admin_theme", state.theme);
  document.documentElement.dataset.theme = resolveTheme(state.theme);
  $("#theme").textContent = THEME_LABELS[state.theme];
}

function cycleTheme() {
  applyTheme(THEMES[(THEMES.indexOf(state.theme) + 1) % THEMES.length]);
  toast(state.theme === "auto" ? "主题：跟随系统" : THEME_LABELS[state.theme]);
}

/* ---------------------------------------------------------- help dialog */

function renderHelp() {
  const shortcuts = [
    ["Ctrl / ⌘ + K", "聚焦搜索框"],
    ["/", "聚焦搜索框"],
    ["Ctrl / ⌘ + E", "导出当前页（CSV，遵循当前搜索）"],
    ["Ctrl / ⌘ + J", "切换主题：自动 / 浅色 / 深色"],
    ["Alt + 1…9", "跳转到第 N 个页面"],
    ["?", "打开本帮助"],
    ["Esc", "清空搜索 / 关闭提示"],
  ];
  $("#shortcut-list").innerHTML = `<table><thead><tr><th>按键</th><th>作用</th></tr></thead><tbody>${
    shortcuts.map(([keys, what]) => `<tr><td><kbd>${esc(keys)}</kbd></td><td>${esc(what)}</td></tr>`).join("")
  }</tbody></table>`;
  $("#code-list").innerHTML = `<table><thead><tr><th>错误码</th><th>含义</th><th>建议</th></tr></thead><tbody>${
    Object.entries(ERROR_CODES).map(([code, [name, action]]) =>
      `<tr><td><code>${esc(code)}</code></td><td>${esc(name)}</td><td>${esc(action)}</td></tr>`).join("")
  }</tbody></table>`;
}

function openHelp() {
  if (!$("#shortcuts").open) $("#shortcuts").showModal();
}

function isTyping(event) {
  const tag = (event.target.tagName || "").toUpperCase();
  return tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT" || event.target.isContentEditable;
}

/* ------------------------------------------------------------ connection */

function setConnected(ok, status) {
  const version = $("#version");
  if (ok && status) {
    state.status = status;
    state.readonly = Boolean(status.readonly);
    version.textContent = `v${status.version}`;
    version.className = "badge ok";
    const ro = $("#ro");
    ro.hidden = false;
    ro.textContent = status.readonly ? "只读模式" : "可写";
    ro.className = "badge " + (status.readonly ? "warn" : "ok");
  } else {
    version.textContent = "未连接";
    version.className = "badge bad";
    $("#ro").hidden = true;
  }
}

async function connect(silent = false) {
  state.token = $("#token").value.trim();
  if (state.token) sessionStorage.setItem("tickhub_admin_token", state.token);
  else sessionStorage.removeItem("tickhub_admin_token");
  try {
    const status = await api("/api/status");
    setConnected(true, status);
    if (!silent) toast("已连接");
    return true;
  } catch (exc) {
    setConnected(false);
    if (!silent) toast(exc.message || String(exc), true);
    return false;
  }
}

/* ------------------------------------------------------------- actions */

async function handleAction(action, button) {
  const result = $("#action-result");
  const show = (value) => { if (result) result.innerHTML = `<h3>结果</h3>${typeof value === "string" ? value : pre(value)}`; };

  if (action === "refresh-view") return renderRoute(true);

  if (action === "sources-check") {
    if (!guardReadonly()) return;
    return runAction(button, async () => {
      const data = await post("/api/sources/check");
      show(kv([["来源数", Object.keys(data.health || {}).length], ["说明", data.note]]));
      toast("已导出健康快照");
    });
  }

  if (action === "cache-flush") {
    if (!guardReadonly()) return;
    const prefix = ($("#cache-prefix") || {}).value || "";
    if (!window.confirm(prefix ? `确认失效前缀 “${prefix}” 下的缓存？` : "确认清空全部缓存？")) return;
    return runAction(button, async () => {
      const data = await post("/api/cache/flush", { prefix });
      show(kv([["前缀", data.prefix || "（全部）"], ["移除键数", data.removed]]));
      toast(`已移除 ${data.removed} 个键`);
    });
  }

  if (action === "proxy-check" || action === "proxy-reload") {
    if (!guardReadonly()) return;
    return runAction(button, async () => {
      const data = await post(action === "proxy-check" ? "/api/proxy/check" : "/api/proxy/reload");
      show(table(data.nodes || []));
      toast(action === "proxy-check" ? "探测完成" : "代理池已重新加载");
    });
  }

  if (action === "fieldmap-save") {
    if (!guardReadonly()) return;
    return runAction(button, async () => {
      const content = $("#fieldmap").value;
      const data = await api("/api/fieldmap", { method: "PUT", body: JSON.stringify({ content }) });
      show(kv([["已加载工具", (data.tools || []).length], ["工具列表", (data.tools || []).join(", ")]]));
      toast("字段映射已保存并热加载");
    });
  }

  if (action === "fieldmap-revert") {
    return renderRoute(true);
  }

  if (action === "fieldmap-preview") {
    const tool = $("#preview-tool").value.trim();
    const code = $("#preview-code").value.trim();
    return runAction(button, async () => {
      const query = new URLSearchParams({ tool, code });
      const data = await api(`/api/fieldmap/preview?${query}`);
      $("#preview-result").innerHTML = `<h3>${esc(data.tool)}</h3>${kv([["参数", JSON.stringify(data.params)]])}${pre(data.payload)}`;
    });
  }

  if (action === "mcp-filter") {
    const layer = $("#mcp-layer").value;
    state.mcpLayer = layer;
    state.toolsView = layer
      ? await api("/api/mcp/tools?layer=" + encodeURIComponent(layer))
      : state.tools;
    return renderRoute(true);
  }

  if (action === "mcp-call") {
    if (!guardReadonly()) return;
    return runAction(button, async () => {
      const tool = $("#call-tool").value.trim();
      let params;
      try { params = JSON.parse($("#call-params").value || "{}"); }
      catch (_) { toast("参数不是合法 JSON", true); return; }
      try {
        const data = await post("/api/mcp/call", { tool, params });
        show(pre(data.payload) + codeHelpHtml(JSON.stringify(data.payload)));
      } catch (exc) {
        const payload = exc.payload || { error: exc.message };
        show(pre(payload) + codeHelpHtml(JSON.stringify(payload)));
        throw exc;
      }
    });
  }

  if (action === "data-crosscheck") {
    const code = $("#data-code").value.trim();
    const date = $("#data-date").value.trim();
    const query = new URLSearchParams({ code, report_date: date });
    return runAction(button, async () => {
      const data = await api(`/api/crosscheck?${query}`);
      show(pre(data.payload) + codeHelpHtml(JSON.stringify(data.payload)));
    });
  }

  if (action === "data-risk") {
    const code = $("#data-code").value.trim();
    return runAction(button, async () => {
      const data = await api(`/api/risk?${new URLSearchParams({ code, limit: "100" })}`);
      show(table(data.events || []));
    });
  }

  if (action === "crawler-run") {
    if (!guardReadonly()) return;
    return runAction(button, async () => {
      const body = {
        task: $("#crawler-task").value,
        days: Number($("#crawler-days").value || 7),
        codes: ($("#crawler-codes").value || "").split(/[,\s]+/).filter(Boolean),
      };
      const data = await post("/api/crawler/run", body);
      show(pre(data));
      toast("任务已执行");
    });
  }

  if (action === "logs-query") {
    const query = new URLSearchParams({
      limit: $("#log-limit").value || "200",
      level: $("#log-level").value,
      q: $("#log-q").value,
    });
    return runAction(button, async () => {
      const data = await api(`/api/logs?${query}`);
      $("#log-rows").innerHTML = table(data.rows);
    });
  }
}

document.addEventListener("click", (event) => {
  const button = event.target.closest("[data-action]");
  if (!button) return;
  event.preventDefault();
  handleAction(button.dataset.action, button).catch((exc) => toast(exc.message || String(exc), true));
});

/* --------------------------------------------------------------- routing */

const ROUTES = Object.keys(views);

function currentRoute() {
  const name = (location.hash.replace(/^#\//, "") || "dashboard").split("?")[0];
  return ROUTES.includes(name) ? name : "dashboard";
}

let rendering = false;

async function renderRoute(force = false) {
  if (rendering) return;
  rendering = true;
  const route = currentRoute();
  document.querySelectorAll("#nav a").forEach((a) => a.classList.toggle("active", a.dataset.route === route));
  const view = $("#view");
  if (force) view.innerHTML = "<p class='muted'>加载中…</p>";
  try {
    view.innerHTML = await views[route]();
  } catch (exc) {
    view.innerHTML = `<h2>加载失败</h2><p class="err">${esc(exc.message || String(exc))}</p>
      ${codeHelpHtml(exc.message)}<div class="row"><button type="button" class="primary" data-action="refresh-view">重试</button></div>`;
  } finally {
    rendering = false;
  }
}

function fmtDuration(seconds) {
  const s = Math.max(0, Math.round(Number(seconds) || 0));
  const d = Math.floor(s / 86400), h = Math.floor((s % 86400) / 3600), m = Math.floor((s % 3600) / 60);
  if (d) return `${d}天 ${h}小时`;
  if (h) return `${h}小时 ${m}分`;
  if (m) return `${m}分 ${s % 60}秒`;
  return `${s}秒`;
}

window.addEventListener("hashchange", () => {
  const search = $("#search");
  if (search.value) { search.value = ""; applySearch(); }
  renderRoute();
});
$("#connect").addEventListener("click", () => connect().then((ok) => { if (ok) renderRoute(true); }));
$("#token").addEventListener("keydown", (event) => {
  if (event.key === "Enter") { event.preventDefault(); $("#connect").click(); }
});

/* ------------------------------------------- search / export / theme / help */

$("#search").addEventListener("input", applySearch);
$("#export").addEventListener("click", exportView);
$("#theme").addEventListener("click", cycleTheme);
$("#shortcut-button").addEventListener("click", openHelp);
$("#shortcuts").addEventListener("close", () => $("#shortcut-button").focus());

// Views swap innerHTML wholesale, so re-apply the filter whenever content lands.
new MutationObserver(applySearch).observe($("#view"), { childList: true, subtree: true });

window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => {
  if (state.theme === "auto") applyTheme("auto");
});

document.addEventListener("keydown", (event) => {
  const mod = event.ctrlKey || event.metaKey;
  const key = event.key.toLowerCase();
  if (mod && key === "k") { event.preventDefault(); $("#search").focus(); $("#search").select(); return; }
  if (mod && key === "e") { event.preventDefault(); exportView(); return; }
  if (mod && key === "j") { event.preventDefault(); cycleTheme(); return; }
  if (event.key === "Escape") {
    if ($("#shortcuts").open) return;
    const search = $("#search");
    if (search.value) { search.value = ""; applySearch(); }
    if (document.activeElement === search) search.blur();
    $("#toast").style.display = "none";
    return;
  }
  if (isTyping(event) || mod) return;
  if (event.key === "/") { event.preventDefault(); $("#search").focus(); return; }
  if (event.key === "?") { event.preventDefault(); openHelp(); return; }
  if (event.altKey && /^[1-9]$/.test(event.key)) {
    const route = ROUTES[Number(event.key) - 1];
    if (route) { event.preventDefault(); location.hash = `#/${route}`; }
  }
});

renderHelp();
applyTheme(state.theme);
$("#token").value = state.token;
connect(true).then(() => renderRoute());
</script>
