<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>TickHub-CN 管理控制台</title>
<style>
  :root {
    color-scheme: light;
    --fg: #1d2430; --muted: #5b6675; --line: #d8dee8; --bg: #fff;
    --accent: #0b63c5; --ok: #12805c; --warn: #b25e09; --bad: #b42318;
    --soft: #f4f6fa;
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --fg: #e6eaf0; --muted: #9aa6b5; --line: #33404f; --bg: #151b23;
    --accent: #6fb0ff; --ok: #4ad6a4; --warn: #f0a44a; --bad: #ff8a7a;
    --soft: #1c242e;
  }
  /* Theme toggle is applied by script; this keeps a no-JS page dark-aware. */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme]) {
      color-scheme: dark;
      --fg: #e6eaf0; --muted: #9aa6b5; --line: #33404f; --bg: #151b23;
      --accent: #6fb0ff; --ok: #4ad6a4; --warn: #f0a44a; --bad: #ff8a7a;
      --soft: #1c242e;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; flex-direction: column;
         background: var(--bg); color: var(--fg);
         font: 14px/1.55 system-ui, "Segoe UI", "Microsoft YaHei", sans-serif; }
  a { color: var(--accent); }
  header { position: sticky; top: 0; z-index: 5; display: flex; flex-wrap: wrap; gap: 8px 12px;
           align-items: center; justify-content: space-between; padding: 10px 20px;
           border-bottom: 1px solid var(--line); background: var(--bg); }
  header h1 { margin: 0; font-size: 17px; white-space: nowrap; }
  header .spacer { flex: 1; }
  .badge { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px;
           border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
  .badge.ok { color: var(--ok); border-color: var(--ok); }
  .badge.warn { color: var(--warn); border-color: var(--warn); }
  .badge.bad { color: var(--bad); border-color: var(--bad); }
  .layout { display: grid; grid-template-columns: 190px minmax(0, 1fr); flex: 1;
            align-items: start; min-height: 0; }
  nav { padding: 14px 10px; border-right: 1px solid var(--line); }
  nav a { display: block; padding: 7px 10px; border-radius: 7px; text-decoration: none;
          color: var(--fg); font-size: 13.5px; }
  nav a:hover { background: var(--soft); }
  nav a.active { background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--accent); font-weight: 600; }
  main { padding: 20px 24px 56px; max-width: 1280px; }
  h2 { font-size: 19px; margin: 0 0 2px; }
  p.sub { margin: 0 0 18px; color: var(--muted); }
  h3 { font-size: 15px; margin: 24px 0 8px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 18px; }
  .card { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
  .card .k { font-size: 12px; color: var(--muted); }
  .card .v { font-size: 21px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .row { display: flex; flex-wrap: wrap; gap: 10px 12px; align-items: flex-end; margin: 12px 0; }
  label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); min-width: 0; }
  input, select, textarea, button { font: inherit; padding: 7px 9px; border: 1px solid var(--line);
          border-radius: 7px; background: transparent; color: var(--fg); }
  input, select, button { height: 34px; }
  select { padding-right: 22px; }
  textarea { width: 100%; min-height: 380px; font-family: ui-monospace, Consolas, monospace; font-size: 12.5px; }
  button { cursor: pointer; padding-inline: 14px; }
  button:hover:not([disabled]) { border-color: var(--accent); }
  button.primary:hover:not([disabled]) { filter: brightness(1.08); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.danger { color: var(--bad); border-color: var(--bad); }
  button[disabled] { opacity: .5; cursor: not-allowed; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 6px 9px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; background: var(--bg); white-space: nowrap; }
  tbody tr:hover { background: var(--soft); }
  td { font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
  .scroll { overflow-x: auto; }
  pre { overflow: auto; padding: 12px; border: 1px solid var(--line); border-radius: 8px;
        background: var(--soft); font-size: 12px; max-height: 460px; }
  .muted { color: var(--muted); }
  .err { color: var(--bad); white-space: pre-wrap; }
  .ok { color: var(--ok); }
  #toast { position: fixed; right: 18px; bottom: 18px; z-index: 30; max-width: min(460px, calc(100vw - 36px));
           padding: 10px 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--soft);
           box-shadow: 0 6px 20px rgba(0,0,0,.18); display: none; white-space: pre-wrap; }
  .empty { padding: 14px; border: 1px dashed var(--line); border-radius: 8px; color: var(--muted); }
  #search { width: min(260px, 46vw); }
  #hits[hidden], tbody tr[hidden] { display: none; }
  th[data-sortable] { cursor: pointer; user-select: none; }
  th[data-sortable]:hover { color: var(--fg); }
  .sort-arrow { font-size: 11px; color: var(--accent); }
  th[aria-sort="none"] .sort-arrow { opacity: .35; }
  .sort-note { margin: 6px 0 0; font-size: 12px; }
  #search-results { margin: 12px 24px 0; padding: 12px 14px; border: 1px solid var(--line);
                    border-radius: 10px; background: var(--soft); }
  #search-results[hidden] { display: none; }
  #search-results ul { margin: 6px 0 0; padding-left: 18px; }
  #search-results li { margin: 3px 0; }
  kbd { padding: 1px 6px; border: 1px solid var(--line); border-bottom-width: 2px;
        border-radius: 5px; background: var(--soft); font: 12px ui-monospace, Consolas, monospace; }
  .codes { margin: 6px 0 0; padding-left: 18px; color: var(--muted); font-size: 12.5px; }
  .call-meta { margin: 0 0 12px; padding: 10px 14px; border: 1px solid var(--line);
               border-left: 3px solid var(--accent); border-radius: 8px; background: var(--soft); }
  .call-meta.degraded { border-left-color: var(--warn); }
  .call-meta .degraded-line { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: baseline; margin: 0 0 6px; }
  .call-meta .note { margin: 6px 0 0; color: var(--muted); }
  dialog { max-width: min(760px, calc(100vw - 32px)); max-height: 80vh; overflow: auto;
           padding: 18px 22px; border: 1px solid var(--line); border-radius: 12px;
           background: var(--bg); color: var(--fg); box-shadow: 0 18px 48px rgba(0,0,0,.3); }
  dialog::backdrop { background: rgba(0,0,0,.45); }
  dialog h3 { margin-top: 4px; }
  dialog form { margin-top: 14px; text-align: right; }
  details summary { cursor: pointer; color: var(--muted); }
  .split { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 18px; }
  .kv { display: grid; grid-template-columns: minmax(140px, 240px) minmax(0, 1fr); gap: 2px 14px; font-size: 13px; }
  .kv dt { color: var(--muted); overflow-wrap: anywhere; }
  .kv dd { margin: 0; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
  .progress { height: 10px; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; background: var(--soft); }
  .progress-fill { height: 100%; width: 0; background: var(--accent); transition: width .3s ease; }
  .chart { display: block; max-width: 100%; height: auto; margin: 4px 0 12px; }
  .chart .svg-label { font-size: 12px; fill: var(--muted); }
  .chart .svg-value { font-size: 12px; fill: var(--fg); font-variant-numeric: tabular-nums; }
  .chart-legend { display: flex; flex-wrap: wrap; gap: 6px 12px; margin: 6px 0; font-size: 12px; color: var(--muted); }
  .chart-legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
  @media (max-width: 760px) {
    .layout { grid-template-columns: 1fr; }
    nav { display: flex; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--line); }
    nav a { white-space: nowrap; }
    main { padding: 16px 16px 48px; }
    header { padding: 10px 14px; }
  }
</style>
</head>
<body>
<header>
  <h1>TickHub-CN 管理控制台</h1>
  <span id="version" class="badge">未连接</span>
  <span id="ro" class="badge" hidden></span>
  <label style="flex-direction:row;align-items:center;gap:6px;white-space:nowrap;">
    搜索
    <input id="search" type="search" placeholder="过滤当前页；回车搜索全部页面（Ctrl+K）" autocomplete="off" />
  </label>
  <span id="hits" class="badge" hidden></span>
  <span class="spacer"></span>
  <button id="export" type="button" title="导出当前页表格为 CSV（Ctrl+E）">导出 CSV</button>
  <button id="export-xlsx" type="button" title="导出当前页表格为 Excel（Ctrl+Shift+E）">导出 xlsx</button>
  <button id="theme" type="button" title="切换主题：自动 / 浅色 / 深色（Ctrl+J）">主题：自动</button>
  <button id="shortcut-button" type="button" title="快捷键与错误码释义（?）" aria-label="快捷键与错误码释义">?</button>
  <label style="flex-direction:row;align-items:center;gap:6px;white-space:nowrap;">
    管理令牌
    <input id="token" type="password" autocomplete="off" placeholder="ADMIN_AUTH_TOKEN（本机可留空）" style="width:min(230px,45vw);" />
  </label>
  <button id="connect" class="primary" type="button">连接</button>
</header>

<div id="search-results" hidden></div>

<div class="layout">
  <nav id="nav">
    <a href="#/dashboard" data-route="dashboard">概览</a>
    <a href="#/sources" data-route="sources">数据源健康</a>
    <a href="#/cache" data-route="cache">缓存</a>
    <a href="#/proxy" data-route="proxy">代理池</a>
    <a href="#/fieldmap" data-route="fieldmap">字段映射</a>
    <a href="#/mcp" data-route="mcp">MCP 调试</a>
    <a href="#/data" data-route="data">数据核查</a>
    <a href="#/crawler" data-route="crawler">抓取任务</a>
    <a href="#/northbound" data-route="northbound">北向资金</a>
    <a href="#/logs" data-route="logs">日志</a>
    <a href="#/config" data-route="config">运行配置</a>
    <a href="#/audit" data-route="audit">审计</a>
  </nav>
  <main id="view"></main>
</div>

<div id="toast" role="status" aria-live="polite"></div>

<dialog id="shortcuts" aria-labelledby="shortcuts-title">
  <h2 id="shortcuts-title" style="font-size:16px;">快捷键</h2>
  <div id="shortcut-list"></div>
  <h3>错误码释义</h3>
  <p class="muted" style="margin:0 0 8px;">后端返回的 <code>QFSD-xxxx</code> 在提示与结果里会附带这里的解释。</p>
  <div id="code-list"></div>
  <form method="dialog"><button type="submit" class="primary">关闭</button></form>
</dialog>

<script>
"use strict";

/* ---------------------------------------------------------------- state */

const state = {
  token: sessionStorage.getItem("tickhub_admin_token") || "",
  readonly: null,
  status: null,
  tools: null,
  toolsView: null,
  mcpLayer: "",
  nbDate: "",
  theme: localStorage.getItem("tickhub_admin_theme") || "auto",
  keepSearch: false,
  scanning: false,
};

const $ = (sel) => document.querySelector(sel);

/* -------------------------------------------------------------- helpers */

function esc(value) {
  if (value === null || value === undefined) return "<span class='muted'>—</span>";
  if (typeof value === "object") return esc(JSON.stringify(value));
  return String(value).replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
  })[c]);
}

function boolBadge(flag, good = "正常", bad = "异常") {
  return flag ? `<span class="badge ok">${esc(good)}</span>` : `<span class="badge bad">${esc(bad)}</span>`;
}

/* ---------------------------------------------------------- error codes */

// Mirrors ERROR_CODES in src/tickhub_cn/core/errors.py (a UI test keeps them equal).
const ERROR_CODES = {
  "QFSD-1001": ["数据源超时", "切换备用源"],
  "QFSD-1002": ["数据源空数据", "切源或返回空并标记"],
  "QFSD-2001": ["Redis 不可用", "降级直连并告警"],
  "QFSD-3001": ["字段映射配置错误", "回退全字段并告警"],
  "QFSD-4001": ["财报勾稽失败", "标记 fail，阻断脏数据"],
  "QFSD-5001": ["代理全池失效", "降级直连并告警"],
  "QFSD-6001": ["Admin 鉴权失败", "拒绝并审计"],
  "QFSD-7001": ["限流命中", "返回重试建议"],
  "QFSD-8001": ["批量部分失败", "返回成功/失败列表"],
  "QFSD-9001": ["参数错误", "修正参数"],
  "QFSD-9002": ["当前数据源不支持该能力", "查看降级说明"],
  "QFSD-9003": ["数据源返回异常", "重试或切源"],
  "QFSD-9004": ["需要鉴权或 API Key", "配置密钥"],
  "QFSD-9005": ["未找到数据", "确认代码/日期"],
};

function codeNotes(text) {
  const seen = [];
  for (const match of String(text === undefined || text === null ? "" : text).matchAll(/QFSD-\d{4}|QF-\d{4}/g)) {
    const code = match[0].startsWith("QF-") ? "QFSD-" + match[0].slice(3) : match[0];
    if (!seen.includes(code)) seen.push(code);
  }
  return seen.map((code) => {
    const meta = ERROR_CODES[code] || ["未知错误码", "查看服务端日志"];
    return `${code} ${meta[0]} → ${meta[1]}`;
  });
}

function explain(text) {
  const body = String(text === undefined || text === null ? "" : text);
  const notes = codeNotes(body);
  return notes.length ? `${body}\n错误码释义：\n${notes.join("\n")}` : body;
}

function codeHelpHtml(text) {
  const notes = codeNotes(text);
  if (!notes.length) return "";
  return `<ul class="codes">${notes.map((note) => `<li>${esc(note)}</li>`).join("")}</ul>`;
}

function toast(message, isError) {
  const box = $("#toast");
  box.textContent = isError ? explain(message) : message;
  box.classList.toggle("err", Boolean(isError));
  box.style.display = "block";
  clearTimeout(toast._t);
  toast._t = setTimeout(() => { box.style.display = "none"; }, isError ? 8000 : 3500);
}

async function api(path, options = {}) {
  const headers = Object.assign({ Accept: "application/json" }, options.headers || {});
  if (options.body !== undefined) headers["Content-Type"] = "application/json";
  if (state.token) headers["X-Admin-Token"] = state.token;

  const response = await fetch(path, Object.assign({}, options, { headers, credentials: "same-origin" }));
  let payload = null;
  try { payload = await response.json(); } catch (_) { /* non-JSON body */ }

  if (response.status === 401) {
    setConnected(false);
    throw new Error("鉴权失败（401）：请在顶部填写 ADMIN_AUTH_TOKEN");
  }
  if (!response.ok) {
    const detail = payload && payload.detail !== undefined ? payload.detail
                 : payload && payload.error ? payload.error
                 : payload;
    throw Object.assign(new Error(typeof detail === "string" ? detail : JSON.stringify(detail)), {
      status: response.status, payload,
    });
  }
  return payload;
}

function post(path, body) {
  return api(path, { method: "POST", body: JSON.stringify(body || {}) });
}

// Table order has exactly one owner per table. Feeds the server already sorted
// (logs / audit / risk events, newest first) pass {sort: false} and keep their
// order; every other table is a snapshot and may be re-sorted by the reader.
function table(rows, columns, opts = {}) {
  if (!Array.isArray(rows) || !rows.length) return "<p class='empty'>没有记录。</p>";
  const keys = columns || (() => {
    const out = [];
    for (const row of rows) {
      if (row && typeof row === "object") for (const k of Object.keys(row)) if (!out.includes(k)) out.push(k);
    }
    return out;
  })();
  if (!keys.length) return `<pre>${esc(JSON.stringify(rows, null, 2))}</pre>`;

  const body = rows.slice(0, 500).map((row) =>
    `<tr>${keys.map((k) => `<td>${esc(row ? row[k] : "")}</td>`).join("")}</tr>`).join("");
  const more = rows.length > 500 ? `<p class="muted">仅显示前 500 / ${rows.length} 行。</p>` : "";
  const sortable = opts.sort !== false;
  const head = sortable
    ? keys.map((k, i) => `<th data-sortable data-col="${i}" tabindex="0" aria-sort="none" title="点击按“${esc(k)}”排序">${esc(k)}<span class="sort-arrow"> ↕</span></th>`).join("")
    : keys.map((k) => `<th>${esc(k)}</th>`).join("");
  const note = opts.note ? `<p class="muted sort-note">${esc(opts.note)}</p>` : "";
  return `<div class="scroll"><table${sortable ? ' class="sortable"' : ""}><thead><tr>${head}</tr></thead>
    <tbody>${body}</tbody></table></div>${more}${note}`;
}

/* sort-core */
function cellText(cell) {
  return (cell && cell.textContent ? cell.textContent : "").replace(/\s+/g, " ").trim();
}

function isBlank(text) {
  return text === "" || text === "—" || text === "-";
}

function compareCells(a, b) {
  const na = Number(a);
  const nb = Number(b);
  if (a !== "" && b !== "" && Number.isFinite(na) && Number.isFinite(nb)) return na - nb;
  return a.localeCompare(b, "zh-CN", { numeric: true, sensitivity: "base" });
}
/* sort-core-end */

function sortTable(table, column, header) {
  const tbody = table.tBodies[0];
  if (!tbody) return;
  const desc = table.dataset.sortCol === String(column) && table.dataset.sortDir === "asc";
  const dir = desc ? "desc" : "asc";
  const rows = [...tbody.rows].sort((left, right) => {
    const a = cellText(left.cells[column]);
    const b = cellText(right.cells[column]);
    const aBlank = isBlank(a);
    const bBlank = isBlank(b);
    if (aBlank || bBlank) return aBlank === bBlank ? 0 : (aBlank ? 1 : -1);  // blanks stay last
    const cmp = compareCells(a, b);
    return dir === "asc" ? cmp : -cmp;
  });
  tbody.append(...rows);
  table.dataset.sortCol = String(column);
  table.dataset.sortDir = dir;
  table.querySelectorAll("th[data-sortable]").forEach((th) => {
    const active = th === header;
    th.setAttribute("aria-sort", active ? (dir === "asc" ? "ascending" : "descending") : "none");
    const arrow = th.querySelector(".sort-arrow");
    if (arrow) arrow.textContent = active ? (dir === "asc" ? " ▲" : " ▼") : " ↕";
  });
}

function kv(rows) {
  if (!Array.isArray(rows) || !rows.length) return "<p class='empty'>没有记录。</p>";
  const items = rows.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("");
  return `<dl class="kv">${items}</dl>`;
}

function cards(items) {
  return `<div class="cards">${items.map(([k, v, cls]) =>
    `<div class="card"><div class="k">${esc(k)}</div><div class="v ${cls || ""}">${esc(v)}</div></div>`).join("")}</div>`;
}

function pre(value) {
  return `<pre>${esc(typeof value === "string" ? value : JSON.stringify(value, null, 2))}</pre>`;
}

// Mirror of the ``degraded`` tags emitted by the data layer; an unknown tag
// still renders, so a new one never hides the warning.
const DEGRADED_LABELS = {
  eod_datacenter: "日频数据中心口径，非实时",
  eod_constituent: "日频成分表，非实时",
  headline_roster: "头条口径名单，可能不全",
  stale_cache: "上游限流或熔断，返回最近一次成功结果",
  tdx_package_stale: "盘后包未覆盖所请求的交易日",
  tdx_package_missing: "部分市场盘后包缺失",
};

function metaBanner(payload) {
  const meta = payload && payload.meta;
  if (!meta || typeof meta !== "object") return "";
  const facts = [];
  if (meta.data_as_of) facts.push(["数据时点", meta.data_as_of]);
  if (meta.source) facts.push(["来源", meta.source]);
  if (meta.cache_hit !== undefined) facts.push(["缓存", meta.cache_hit ? "命中" : "未命中"]);
  if (meta.count !== undefined) facts.push(["条数", meta.count]);
  const degraded = meta.degraded ? String(meta.degraded) : "";
  if (!degraded && !facts.length && !meta.note) return "";
  const label = DEGRADED_LABELS[degraded];
  const lead = degraded
    ? `<p class="degraded-line"><span class="badge warn">降级</span><code>${esc(degraded)}</code>${label ? `<span>${esc(label)}</span>` : ""}</p>`
    : "";
  const rows = facts.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("");
  const list = rows ? `<dl class="kv">${rows}</dl>` : "";
  const note = meta.note ? `<p class="note">${esc(meta.note)}</p>` : "";
  return `<div class="call-meta${degraded ? " degraded" : ""}">${lead}${list}${note}</div>`;
}

/* --------------------------------------------------------------- charts */
/* Hand-written SVG (DEC-017 keeps the console a single file with no CDN). */

function clip(text, max = 24) {
  const s = String(text);
  return s.length > max ? s.slice(0, max - 1) + "…" : s;
}

function svgBars(items, opts = {}) {
  const rows = items.filter((it) => Number.isFinite(Number(it.value)));
  if (!rows.length) return "<p class='empty'>暂无可绘制的数据。</p>";
  const width = 560, labelW = 150, valueW = 64, barH = 16, gap = 8, pad = 6;
  const max = Math.max(1, ...rows.map((it) => Math.max(0, Number(it.value))));
  const plotW = width - labelW - valueW - 12;
  const height = pad * 2 + rows.length * (barH + gap) - gap;
  const label = opts.title || "条形图";
  const bars = rows.map((it, i) => {
    const value = Math.max(0, Number(it.value));
    const y = pad + i * (barH + gap);
    const w = Math.max(2, (plotW * value) / max);
    const fill = it.color || "var(--accent)";
    const shown = opts.format ? opts.format(value) : String(Math.round(value));
    return `<text class="svg-label" x="${labelW - 8}" y="${y + barH - 4}" text-anchor="end">${esc(clip(it.label))}</text>
      <rect x="${labelW}" y="${y}" width="${w.toFixed(1)}" height="${barH}" rx="3" fill="${fill}"></rect>
      <text class="svg-value" x="${(labelW + w + 6).toFixed(1)}" y="${y + barH - 4}">${esc(shown)}</text>`;
  }).join("");
  return `<svg class="chart" viewBox="0 0 ${width} ${height}" width="100%" role="img" aria-label="${esc(label)}">
    <title>${esc(label)}</title>${bars}</svg>`;
}

function svgStack(parts, opts = {}) {
  const rows = parts.map((p) => ({ ...p, value: Math.max(0, Number(p.value) || 0) }));
  const total = rows.reduce((sum, p) => sum + p.value, 0);
  if (!total) return "<p class='empty'>还没有可统计的数据。</p>";
  const width = 560, height = 24;
  let x = 0;
  const segs = rows.map((p) => {
    const w = (width * p.value) / total;
    const seg = `<rect x="${x.toFixed(1)}" y="0" width="${w.toFixed(1)}" height="${height}" fill="${p.color}">
      <title>${esc(p.label)}：${p.value}</title></rect>`;
    x += w;
    return seg;
  }).join("");
  const legend = rows.map((p) =>
    `<span><i style="background:${p.color}"></i>${esc(p.label)} ${p.value}</span>`).join("");
  const label = opts.title || "占比图";
  return `<div class="chart-legend">${legend}</div>
    <svg class="chart" viewBox="0 0 ${width} ${height}" width="100%" role="img" aria-label="${esc(label)}">
      <title>${esc(label)}</title>${segs}</svg>`;
}

function writeButton(label, action, extra = "", cls = "primary") {
  const disabled = state.readonly ? "disabled" : "";
  return `<button type="button" class="${cls}" data-action="${esc(action)}" ${disabled}>${esc(label)}</button>${extra}`;
}

function guardReadonly() {
  if (state.readonly) {
    toast("控制台处于只读模式（ADMIN_READONLY=true），写操作已禁用", true);
    return false;
  }
  return true;
}

async function runAction(button, fn) {
  const original = button.textContent;
  button.disabled = true;
  try { await fn(); }
  catch (exc) { toast(exc.message || String(exc), true); }
  finally { button.textContent = original; button.disabled = Boolean(state.readonly) && button.dataset.allowReadonly !== "1"; }
}

/* -------------------------------------------------------------- search */

function applySearch() {
  const query = $("#search").value.trim().toLowerCase();
  const hits = $("#hits");
  let total = 0;
  let shown = 0;

  const panel = $("#search-results");
  if (panel && !panel.hidden && panel.dataset.query !== query) hideCrossResults();

  document.querySelectorAll("#view table").forEach((table) => {
    table.querySelectorAll("tbody tr").forEach((row) => {
      total += 1;
      const hit = !query || row.textContent.toLowerCase().includes(query);
      row.hidden = !hit;
      if (hit) shown += 1;
    });
  });

  if (!query) {
    hits.hidden = true;
    hits.textContent = "";
    return;
  }
  hits.hidden = false;
  hits.title = "回车搜索其余页面";
  if (!total) {
    hits.textContent = "当前页 0 行";
    hits.className = "badge";
    return;
  }
  hits.textContent = `匹配 ${shown} / ${total} 行`;
  hits.className = "badge " + (shown ? "ok" : "warn");
}

/* ------------------------------------------------------- cross-page scan */

function routeLabel(route) {
  const link = document.querySelector(`#nav a[data-route="${route}"]`);
  return link ? link.textContent.trim() : route;
}

function hideCrossResults() {
  const panel = $("#search-results");
  if (!panel) return;
  panel.hidden = true;
  panel.innerHTML = "";
  delete panel.dataset.query;
}

// Local filtering can only see the rendered route. On Enter we render every
// other route off-screen and report where the query also matches; nothing is
// written to the page or the server, so this is safe in read-only mode.
async function scanRoutes() {
  const query = $("#search").value.trim().toLowerCase();
  const panel = $("#search-results");
  if (!query) { hideCrossResults(); return; }
  if (state.scanning) return;
  state.scanning = true;
  panel.hidden = false;
  panel.dataset.query = query;
  panel.innerHTML = "<p class='muted'>正在搜索其余页面…</p>";

  const found = [];
  try {
    for (const route of ROUTES) {
      if (route === currentRoute()) continue;  // already filtered in place
      try {
        const box = document.createElement("div");
        box.innerHTML = await views[route]();
        let rows = 0;
        const samples = [];
        box.querySelectorAll("table tbody tr").forEach((row) => {
          const text = row.textContent;
          if (!text.toLowerCase().includes(query)) return;
          rows += 1;
          if (samples.length < 2) samples.push(text.replace(/\s+/g, " ").trim().slice(0, 80));
        });
        const loose = !rows && box.textContent.toLowerCase().includes(query);
        if (rows || loose) found.push({ route, rows, sample: samples.join(" · ") });
      } catch (exc) {
        found.push({ route, error: exc.message || String(exc) });
      }
    }
  } finally {
    state.scanning = false;
  }

  const current = [...document.querySelectorAll("#view table tbody tr")].filter((row) => !row.hidden).length;
  const items = found.map((hit) => {
    if (hit.error) {
      return `<li>${esc(routeLabel(hit.route))} <span class="badge warn">读取失败</span>
        <span class="muted">${esc(hit.error)}</span></li>`;
    }
    const count = hit.rows ? `${hit.rows} 行` : "命中非表格内容";
    return `<li><a href="#/${esc(hit.route)}" data-cross-route="${esc(hit.route)}">${esc(routeLabel(hit.route))}</a>
      <span class="badge ok">${esc(count)}</span> <span class="muted">${esc(hit.sample)}</span></li>`;
  });
  panel.innerHTML = `<div class="row" style="margin:0 0 4px;">
      <b>跨页搜索“${esc(query)}”</b>
      <span class="badge">当前页 ${current} 行</span>
      <span class="spacer"></span>
      <button type="button" data-action="search-close">关闭</button>
    </div>
    ${items.length ? `<ul>${items.join("")}</ul>` : "<p class='muted'>其余页面没有匹配内容。</p>"}`;
}

/* -------------------------------------------------------------- export */

function csvCell(value) {
  const text = value === undefined || value === null ? "" : String(value);
  return /[",\r\n]/.test(text) ? `"${text.replace(/"/g, '""')}"` : text;
}

function download(name, data, mime = "text/csv;charset=utf-8") {
  const url = URL.createObjectURL(new Blob([data], { type: mime }));
  const link = document.createElement("a");
  link.href = url;
  link.download = name;
  document.body.appendChild(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  toast(`已导出 ${name}`);
}

function exportStamp() {
  const now = new Date();
  const pad = (n) => String(n).padStart(2, "0");
  return `${now.getFullYear()}${pad(now.getMonth() + 1)}${pad(now.getDate())}-`
    + `${pad(now.getHours())}${pad(now.getMinutes())}${pad(now.getSeconds())}`;
}

// Header cells carry the sort arrow; exports want the label only.
function headerText(th) {
  const clone = th.cloneNode(true);
  const arrow = clone.querySelector(".sort-arrow");
  if (arrow) arrow.remove();
  return clone.textContent.trim();
}

function exportView() {
  const route = currentRoute();
  const view = $("#view");
  const tables = [...view.querySelectorAll("table")];
  const lines = [`# TickHub-CN 管理控制台 / ${route} / ${new Date().toISOString()}`];

  tables.forEach((table, index) => {
    lines.push(`# 表 ${index + 1}`);
    const header = table.querySelector("thead tr");
    if (header) lines.push([...header.children].map((th) => csvCell(headerText(th))).join(","));
    table.querySelectorAll("tbody tr").forEach((row) => {
      if (row.hidden) return;  // exported rows honour the active search
      lines.push([...row.children].map((td) => csvCell(td.textContent)).join(","));
    });
  });

  if (!tables.length) {
    const text = view.innerText.trim();
    if (!text) { toast("当前页没有可导出的内容", true); return; }
    lines.push(csvCell(text));
  }

  download(`tickhub-${route}-${exportStamp()}.csv`, "\ufeff" + lines.join("\r\n"));
}

/* ------------------------------------------------ xlsx (no dependencies) */
/* xlsx-core: store-only ZIP + SpreadsheetML. Hand-rolled so the console keeps
   needing no build step and no third-party script (the page stays CSP-clean). */

const CRC_TABLE = (() => {
  const table = new Uint32Array(256);
  for (let i = 0; i < 256; i += 1) {
    let c = i;
    for (let k = 0; k < 8; k += 1) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1;
    table[i] = c >>> 0;
  }
  return table;
})();

function crc32(bytes) {
  let crc = 0xffffffff;
  for (let i = 0; i < bytes.length; i += 1) crc = CRC_TABLE[(crc ^ bytes[i]) & 0xff] ^ (crc >>> 8);
  return (crc ^ 0xffffffff) >>> 0;
}

function zipStore(files) {
  const encoder = new TextEncoder();
  const now = new Date();
  const dosTime = (now.getHours() << 11) | (now.getMinutes() << 5) | (now.getSeconds() >> 1);
  const dosDate = ((now.getFullYear() - 1980) << 9) | ((now.getMonth() + 1) << 5) | now.getDate();
  const parts = [];
  const central = [];
  let offset = 0;

  for (const file of files) {
    const name = encoder.encode(file.name);
    const data = file.data;
    const crc = crc32(data);

    const local = new Uint8Array(30 + name.length);
    const localView = new DataView(local.buffer);
    localView.setUint32(0, 0x04034b50, true);
    localView.setUint16(4, 20, true);
    localView.setUint16(6, 0x0800, true);
    localView.setUint16(8, 0, true);
    localView.setUint16(10, dosTime, true);
    localView.setUint16(12, dosDate, true);
    localView.setUint32(14, crc, true);
    localView.setUint32(18, data.length, true);
    localView.setUint32(22, data.length, true);
    localView.setUint16(26, name.length, true);
    localView.setUint16(28, 0, true);
    local.set(name, 30);

    const entry = new Uint8Array(46 + name.length);
    const entryView = new DataView(entry.buffer);
    entryView.setUint32(0, 0x02014b50, true);
    entryView.setUint16(4, 20, true);
    entryView.setUint16(6, 20, true);
    entryView.setUint16(8, 0x0800, true);
    entryView.setUint16(10, 0, true);
    entryView.setUint16(12, dosTime, true);
    entryView.setUint16(14, dosDate, true);
    entryView.setUint32(16, crc, true);
    entryView.setUint32(20, data.length, true);
    entryView.setUint32(24, data.length, true);
    entryView.setUint16(28, name.length, true);
    entryView.setUint16(30, 0, true);
    entryView.setUint16(32, 0, true);
    entryView.setUint16(34, 0, true);
    entryView.setUint16(36, 0, true);
    entryView.setUint32(38, 0, true);
    entryView.setUint32(42, offset, true);
    entry.set(name, 46);

    parts.push(local, data);
    central.push(entry);
    offset += local.length + data.length;
  }

  const centralSize = central.reduce((sum, entry) => sum + entry.length, 0);
  const end = new Uint8Array(22);
  const endView = new DataView(end.buffer);
  endView.setUint32(0, 0x06054b50, true);
  endView.setUint16(8, files.length, true);
  endView.setUint16(10, files.length, true);
  endView.setUint32(12, centralSize, true);
  endView.setUint32(16, offset, true);

  const out = new Uint8Array(offset + centralSize + end.length);
  let at = 0;
  for (const part of parts) { out.set(part, at); at += part.length; }
  for (const entry of central) { out.set(entry, at); at += entry.length; }
  out.set(end, at);
  return out;
}

function xmlText(value) {
  return String(value === undefined || value === null ? "" : value)
    .replace(/[\u0000-\u0008\u000b\u000c\u000e-\u001f]/g, "")
    .replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&apos;" }[c]));
}

function colName(index) {
  let name = "";
  for (let n = index + 1; n > 0; n = Math.floor((n - 1) / 26)) {
    name = String.fromCharCode(65 + ((n - 1) % 26)) + name;
  }
  return name;
}

// Excel only sums and right-aligns real numbers. Identifiers such as 000001
// must stay text, so only canonical decimals are converted back.
function spreadsheetCell(text) {
  const value = String(text == null ? "" : text).trim();
  if (!/^-?(?:0|[1-9]\d*)(?:\.\d+)?$/.test(value)) return text;
  const number = Number(value);
  return Number.isFinite(number) ? number : text;
}

function sheetXml(rows) {
  const body = rows.map((cells, r) => {
    const xml = cells.map((value, c) => {
      const ref = colName(c) + (r + 1);
      if (typeof value === "number" && Number.isFinite(value)) return `<c r="${ref}"><v>${value}</v></c>`;
      const text = xmlText(value);
      return text === "" ? `<c r="${ref}"/>`
        : `<c r="${ref}" t="inlineStr"><is><t xml:space="preserve">${text}</t></is></c>`;
    }).join("");
    return `<row r="${r + 1}">${xml}</row>`;
  }).join("");
  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData>${body}</sheetData></worksheet>`;
}

function xlsxBytes(sheets) {
  const encoder = new TextEncoder();
  const relNs = "http://schemas.openxmlformats.org/officeDocument/2006/relationships";
  const names = sheets.map((sheet, i) =>
    (String(sheet.name || "").replace(/[\[\]:*?\/\\]/g, "-").slice(0, 31) || `Sheet${i + 1}`));
  const overrides = sheets.map((_, i) =>
    `<Override PartName="/xl/worksheets/sheet${i + 1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join("");
  const sheetTags = names.map((name, i) =>
    `<sheet name="${xmlText(name)}" sheetId="${i + 1}" r:id="rId${i + 1}"/>`).join("");
  const sheetRels = sheets.map((_, i) =>
    `<Relationship Id="rId${i + 1}" Type="${relNs}/worksheet" Target="worksheets/sheet${i + 1}.xml"/>`).join("");
  const files = [
    { name: "[Content_Types].xml", text: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>${overrides}</Types>` },
    { name: "_rels/.rels", text: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="${relNs}/officeDocument" Target="xl/workbook.xml"/></Relationships>` },
    { name: "xl/workbook.xml", text: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="${relNs}"><sheets>${sheetTags}</sheets></workbook>` },
    { name: "xl/_rels/workbook.xml.rels", text: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${sheetRels}</Relationships>` },
    ...sheets.map((sheet, i) => ({ name: `xl/worksheets/sheet${i + 1}.xml`, text: sheetXml(sheet.rows) })),
  ].map((file) => ({ name: file.name, data: encoder.encode(file.text) }));
  return zipStore(files);
}
/* xlsx-core-end */

function exportViewXlsx() {
  const route = currentRoute();
  const tables = [...$("#view").querySelectorAll("table")];
  if (!tables.length) { toast("当前页没有可导出的表格", true); return; }
  const sheets = tables.map((table, index) => {
    const rows = [];
    const header = table.querySelector("thead tr");
    if (header) rows.push([...header.children].map((th) => headerText(th)));
    table.querySelectorAll("tbody tr").forEach((row) => {
      if (row.hidden) return;
      rows.push([...row.children].map((td) => spreadsheetCell(td.textContent)));
    });
    return { name: `表${index + 1}`, rows };
  });
  download(`tickhub-${route}-${exportStamp()}.xlsx`, xlsxBytes(sheets),
    "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet");
}

/* --------------------------------------------------------------- theme */

const THEMES = ["auto", "light", "dark"];
const THEME_LABELS = { auto: "主题：自动", light: "主题：浅色", dark: "主题：深色" };

function resolveTheme(pref) {
  if (pref === "light" || pref === "dark") return pref;
  return window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
}

function applyTheme(pref) {
  state.theme = THEMES.includes(pref) ? pref : "auto";
  localStorage.setItem("tickhub_admin_theme", state.theme);
  document.documentElement.dataset.theme = resolveTheme(state.theme);
  $("#theme").textContent = THEME_LABELS[state.theme];
}

function cycleTheme() {
  applyTheme(THEMES[(THEMES.indexOf(state.theme) + 1) % THEMES.length]);
  toast(state.theme === "auto" ? "主题：跟随系统" : THEME_LABELS[state.theme]);
}

function isTyping(event) {

/* ------------------------------------------------------------ connection */

function setConnected(ok, status) {
  const version = $("#version");
  if (ok && status) {
    state.status = status;
    state.readonly = Boolean(status.readonly);
    version.textContent = `v${status.version}`;
    version.className = "badge ok";
    const ro = $("#ro");
    ro.hidden = false;
    ro.textContent = status.readonly ? "只读模式" : "可写";
    ro.className = "badge " + (status.readonly ? "warn" : "ok");
  } else {
    version.textContent = "未连接";
    version.className = "badge bad";
    $("#ro").hidden = true;
  }
}

async function connect(silent = false) {
  state.token = $("#token").value.trim();
  if (state.token) sessionStorage.setItem("tickhub_admin_token", state.token);
  else sessionStorage.removeItem("tickhub_admin_token");
  try {
    const status = await api("/api/status");
    setConnected(true, status);
    if (!silent) toast("已连接");
    return true;
  } catch (exc) {
    setConnected(false);
    if (!silent) toast(exc.message || String(exc), true);
    return false;
  }
}

const STATUS_LABELS = {
  queued: ["排队中", "warn"],
  running: ["运行中", "ok"],
  ok: ["完成", "ok"],
  partial: ["部分成功", "warn"],
  failed: ["失败", "bad"],
  cancelled: ["已取消", "warn"],
  empty: ["无数据", "warn"],
};

function statusBadge(status) {
  const [label, cls] = STATUS_LABELS[status] || [status || "未知", ""];
  return `<span class="badge ${cls}">${esc(label)}</span>`;
}

function jobProgress(job) {
  const progress = job.progress || {};
  const total = Number(progress.total) || 0;
  const done = Number(progress.done) || 0;
  const percent = Math.max(0, Math.min(100, Number(progress.percent) || 0));
  const parts = [`已处理 ${done}${total ? ` / ${total}` : ""} 步`];
  if (progress.current) parts.push(`当前 ${esc(progress.current)}`);
  if (progress.failed) parts.push(`失败 ${Number(progress.failed)} 个`);
  return `<div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100"
      aria-valuenow="${percent}" aria-label="任务进度">
      <div class="progress-fill" style="width:${percent}%"></div>
    </div>
    <p class="muted" style="margin:6px 0 0;">${percent}% · ${parts.join(" · ")}</p>`;
}

function jobPanel(job) {
  if (!job) return "<p class='empty'>暂无任务。提交一次抓取后，这里会实时显示进度。</p>";
  const active = job.status === "queued" || job.status === "running";
  const buttons = [];
  if (active && !state.readonly) {
    buttons.push(`<button type="button" class="danger" data-action="crawler-cancel" data-job="${Number(job.id)}">取消</button>`);
  }
  if (!active && !state.readonly) {
    buttons.push(`<button type="button" data-action="crawler-retry" data-job="${Number(job.id)}">重试</button>`);
  }
  const result = job.result;
  return `
    <h3>任务 #${Number(job.id)} ${statusBadge(job.status)}</h3>
    ${jobProgress(job)}
    ${kv([
      ["任务", job.task],
      ["代码数", job.codes || "—"],
      ["窗口天数", job.days],
      ["已用时长", fmtDuration(job.elapsed_s)],
      ["提交时间", fmtStamp(job.created_at)],
      ["结束时间", fmtStamp(job.finished_at)],
      ["取消请求", job.cancel_requested ? "已发出" : "—"],
      ["抓取 / 写入", result ? `${result.fetched} / ${result.inserted}` : "—"],
      ["失败代码", result && result.failed && result.failed.length ? result.failed.join(", ") : "—"],
    ])}
    ${buttons.length ? `<div class="row">${buttons.join("")}</div>` : ""}
    ${job.error ? `<p class="err">${esc(job.error)}</p>` : ""}
    ${result ? `<details><summary>任务结果</summary>${pre(result)}</details>` : ""}`;
}

function jobTable(jobs) {
  if (!jobs.length) return "<p class='empty'>还没有任务记录。</p>";
  const rows = jobs.map((job) => ({
    "#": job.id,
    任务: job.task,
    状态: job.status,
    进度: `${Number((job.progress || {}).percent) || 0}%`,
    抓取: job.result ? job.result.fetched : "—",
    写入: job.result ? job.result.inserted : "—",
    耗时: fmtDuration(job.elapsed_s),
    提交: job.created_at,
  }));
  const throughput = jobs
    .filter((job) => job.result)
    .slice()
    .reverse()
    .map((job) => ({
      label: `#${job.id} ${job.task}`,
      value: Number(job.result.fetched) || 0,
      color: job.status === "ok" ? "var(--ok)" : job.status === "partial" ? "var(--warn)" : "var(--bad)",
    }));
  return table(rows, null, { sort: false, note: "顺序由服务端决定：最新在前。" })
    + `<h3>最近任务抓取量</h3>${svgBars(throughput, { title: "最近任务抓取量（条）" })}`;
}

// Archive rows outlive the process, so they carry no live progress and no
// cancel/retry controls; the archive id is kept apart from in-process ids.
function archiveTable(rows) {
  if (!rows.length) return "<p class='empty'>归档里还没有任务记录。</p>";
  const data = rows.map((job) => ({
    "#": job.archive_id,
    任务: job.task,
    状态: job.status,
    代码数: job.codes === null || job.codes === undefined ? "—" : job.codes,
    抓取: job.fetched,
    写入: job.inserted,
    耗时: fmtDuration(job.elapsed_s),
    开始: fmtStamp(job.started_at),
    结束: fmtStamp(job.finished_at),
    错误: job.error || "—",
  }));
  return table(data, null, { sort: false, note: "顺序由服务端决定：最新在前。" });
}

function paintCrawlerJobs(jobs) {
  const box = $("#crawler-job");
  const list = $("#crawler-job-list");
  if (!box || !list) return;
  const current = jobs.find((job) => job.status === "queued" || job.status === "running") || jobs[0] || null;
  const key = current
    ? [current.id, current.status, (current.progress || {}).done, (current.progress || {}).total,
       (current.progress || {}).current, current.cancel_requested].join("|")
    : "empty";
  if (box.dataset.key !== key) {
    box.dataset.key = key;
    box.innerHTML = jobPanel(current);
  }
  const listKey = jobs.map((job) => `${job.id}:${job.status}:${(job.progress || {}).percent}`).join(",");
  if (list.dataset.key !== listKey) {
    list.dataset.key = listKey;
    list.innerHTML = jobTable(jobs);
  }
}

let crawlerTimer = null;

function stopCrawlerPoll() {
  if (crawlerTimer) {
    clearInterval(crawlerTimer);
    crawlerTimer = null;
  }
}

function startCrawlerPoll() {
  stopCrawlerPoll();
  crawlerTimer = setInterval(refreshCrawlerJobs, 1500);
}

async function refreshCrawlerJobs() {
  if (currentRoute() !== "crawler") {
    stopCrawlerPoll();
    return;
  }
  let data;
  try {
    data = await api("/api/crawler/jobs?limit=10");
  } catch (exc) {
    stopCrawlerPoll();
    return;
  }
  const jobs = data.jobs || [];
  paintCrawlerJobs(jobs);
  if (!jobs.some((job) => job.status === "queued" || job.status === "running")) stopCrawlerPoll();
}

    api("/api/config/cleaning"),
  ]);
  const c = cleaning.cleaning || {};
  const locks = c.env_locked || {};
  const locked = ["enable", "base_url", "api_key", "model"].filter((k) => locks[k]);
  return `
    <h2>运行配置</h2>
    <h3>正文清洗（可选，默认关闭）</h3>
    <p class="sub">
      只处理公告 / 研报 / 新闻的长文本，价格、财务等数字从不经过模型。
      开关保存到 <code>${esc(c.config_path || "model_gateway.toml")}</code>，MCP 进程下一次调用即生效。
    </p>
    ${c.error ? `<p class="sub" style="color:var(--bad)">配置文件解析失败：${esc(c.error)}</p>` : ""}
    <div class="row">
      <label style="display:flex;align-items:center;gap:6px;">
        <input type="checkbox" id="cleaning-enable" ${c.enable ? "checked" : ""} ${state.readonly ? "disabled" : ""} />
        启用正文清洗
      </label>
      <span class="badge ${c.effective ? "ok" : ""}">${c.effective ? "当前生效" : "当前关闭"}</span>
      ${c.legacy_enable ? `<span class="badge warn">CRAWL4AI_ENABLE=true</span>` : ""}
    </div>
    <div class="row">
      <label>模型网关地址
        <input id="cleaning-base" style="width:300px;" value="${esc(c.base_url || "")}" placeholder="例如 api.openai.com/v1（需带 http(s)://）" />
      </label>
      <label>模型
        <input id="cleaning-model" style="width:180px;" value="${esc(c.model || "")}" placeholder="gpt-4o-mini" />
      </label>
      <label>API Key
        <input id="cleaning-key" type="password" autocomplete="new-password" style="width:240px;"
          placeholder="${c.api_key ? "已设置，留空表示不修改" : "可留空"}" />
      </label>
    </div>
    <label style="display:block;">提示词
      <textarea id="cleaning-prompt" style="min-height:70px;">${esc(c.prompt || "")}</textarea>
    </label>
    ${locked.length ? `<p class="sub" style="color:var(--warn)">
      环境变量已锁定 ${esc(locked.join(" / "))}，这里保存的值不会生效；请先清掉对应的环境变量。
    </p>` : ""}
    <div class="row">
      ${writeButton("保存清洗配置", "cleaning-save")}
      <button type="button" data-action="refresh-view">重新读取</button>
    </div>
    <h3>清洗试跑</h3>
    <p class="sub">粘贴一段公告 HTML 或正文，对比清洗前后。开关关闭时原样返回；开启但模型网关未就绪时退回本地去标签，不产生调用。</p>
    <label style="display:block;">
      <textarea id="cleaning-sample" style="min-height:110px;" placeholder="&lt;div&gt;原文…&lt;/div&gt;"></textarea>
    </label>
    <div class="row">
      <button type="button" class="primary" data-action="cleaning-test" data-allow-readonly="1">试跑</button>
    </div>
    <div id="action-result"></div>
    <h3>全部配置（只读）</h3>
    <p class="sub">敏感项显示为 <code>***</code>；其余修改请通过环境变量或 <code>config/admin.toml</code>。</p>
    ${kv(Object.entries(data.config || {}))}`;
};

views.audit = async () => {
  const data = await api("/api/audit?limit=200");
  return `
    <h2>审计</h2>
    <p class="sub">所有写操作与鉴权事件都会落盘（<code>logs/admin_audit.jsonl</code>），最新在前。</p>
    ${table(data.rows, null, { sort: false, note: "顺序由服务端决定：最新在前。" })}`;
};

/* ------------------------------------------------------------- actions */

async function handleAction(action, button) {
  const result = $("#action-result");
  const show = (value) => { if (result) result.innerHTML = `<h3>结果</h3>${typeof value === "string" ? value : pre(value)}`; };

  if (action === "refresh-view") return renderRoute(true);

  if (action === "nb-refresh") {
    const pick = $("#nb-date");
    state.nbDate = pick ? pick.value : "";
    return renderRoute(true);
  }
  if (action === "search-close") return hideCrossResults();

  if (action === "sources-check") {
    if (!guardReadonly()) return;
    return runAction(button, async () => {
      const data = await post("/api/sources/check");
      show(kv([["来源数", Object.keys(data.health || {}).length], ["说明", data.note]]));
      toast("已导出健康快照");
    });
  }

  if (action === "cache-flush") {
    if (!guardReadonly()) return;
    const prefix = ($("#cache-prefix") || {}).value || "";
    if (!window.confirm(prefix ? `确认失效前缀 “${prefix}” 下的缓存？` : "确认清空全部缓存？")) return;
    return runAction(button, async () => {
      const data = await post("/api/cache/flush", { prefix });
      show(kv([["前缀", data.prefix || "（全部）"], ["移除键数", data.removed]]));
      toast(`已移除 ${data.removed} 个键`);
    });
  }

  if (action === "proxy-check" || action === "proxy-reload") {
    if (!guardReadonly()) return;
    return runAction(button, async () => {
      const data = await post(action === "proxy-check" ? "/api/proxy/check" : "/api/proxy/reload");
      show(table(data.nodes || []));
      toast(action === "proxy-check" ? "探测完成" : "代理池已重新加载");
      if (action === "proxy-reload") await renderRoute(true);
    });
  }

  if (action === "proxy-add") {
    if (!guardReadonly()) return;
    const url = (($("#proxy-url") || {}).value || "").trim();
    if (!url) { toast("请填写代理地址", true); return; }
    const body = {
      url,
      username: (($("#proxy-user") || {}).value || "").trim(),
      password: (($("#proxy-pass") || {}).value || ""),
    };
    return runAction(button, async () => {
      const data = await post("/api/proxy/nodes", body);
      toast(`已添加节点 ${data.node.url}`);
      await renderRoute(true);
    });
  }

  if (action === "proxy-toggle") {
    if (!guardReadonly()) return;
    const enabled = button.dataset.enabled === "1";
    return runAction(button, async () => {
      await post("/api/proxy/nodes/toggle", { key: button.dataset.key, enabled });
      toast(enabled ? "节点已启用" : "节点已停用");
      await renderRoute(true);
    });
  }

  if (action === "proxy-remove") {
    if (!guardReadonly()) return;
    if (!window.confirm("确认删除该代理节点？删除会写回配置文件。")) return;
    return runAction(button, async () => {
      await post("/api/proxy/nodes/remove", { key: button.dataset.key });
      toast("节点已删除");
      await renderRoute(true);
    });
  }

  if (action === "fieldmap-save") {
    if (!guardReadonly()) return;
    return runAction(button, async () => {
      const content = $("#fieldmap").value;
      const data = await api("/api/fieldmap", { method: "PUT", body: JSON.stringify({ content }) });
      show(kv([["已加载工具", (data.tools || []).length], ["工具列表", (data.tools || []).join(", ")]]));
      toast("字段映射已保存并热加载");
    });
  }

  if (action === "fieldmap-revert") {
    return renderRoute(true);
  }

  if (action === "fieldmap-preview") {
    const tool = $("#preview-tool").value.trim();
    const code = $("#preview-code").value.trim();
    return runAction(button, async () => {
      const query = new URLSearchParams({ tool, code });
      const data = await api(`/api/fieldmap/preview?${query}`);
      $("#preview-result").innerHTML = `<h3>${esc(data.tool)}</h3>${kv([["参数", JSON.stringify(data.params)]])}${pre(data.payload)}`;
    });
  }

  if (action === "cleaning-save") {
    if (!guardReadonly()) return;
    return runAction(button, async () => {
      const payload = {
        enable: $("#cleaning-enable").checked,
        base_url: $("#cleaning-base").value.trim(),
        model: $("#cleaning-model").value.trim(),
        prompt: $("#cleaning-prompt").value,
      };
      const key = $("#cleaning-key").value;
      if (key) payload.api_key = key;
      const data = await api("/api/config/cleaning", { method: "PUT", body: JSON.stringify(payload) });
      const c = data.cleaning || {};
      show(kv([
        ["启用", c.enable ? "是" : "否"],
        ["当前生效", c.effective ? "是" : "否"],
        ["模型网关就绪", c.ready ? "是" : "否"],
        ["模型", c.model || "—"],
        ["地址", c.base_url || "—"],
        ["配置文件", c.config_path || "—"],
      ]));
      toast("清洗配置已保存");
      await renderRoute(true);
    });
  }

  if (action === "cleaning-test") {
    const text = $("#cleaning-sample").value;
    if (!text.trim()) { toast("请先粘贴一段文本", true); return; }
    return runAction(button, async () => {
      const data = await post("/api/config/cleaning/test", { text });
      const r = data.result || {};
      const st = r.stat || {};
      show(
        kv([
          ["调用模型", (data.cleaning || {}).ready ? "是" : "否（本地去标签）"],
          ["原长", st.raw_len],
          ["清洗后", st.clean_len],
          ["压缩比", st.reduce_rate],
        ])
        + `<h3>清洗后</h3>${pre(r.clean_content)}`
        + `<h3>原文</h3>${pre(r.raw_content)}`,
      );
    });
  }

  if (action === "mcp-filter") {
    const layer = $("#mcp-layer").value;
    state.mcpLayer = layer;
    state.toolsView = layer
      ? await api("/api/mcp/tools?layer=" + encodeURIComponent(layer))
      : state.tools;
    return renderRoute(true);
  }

  if (action === "mcp-call") {
    return runAction(button, async () => {
      const tool = $("#call-tool").value.trim();
      let params;
      try { params = JSON.parse($("#call-params").value || "{}"); }
      catch (_) { toast("参数不是合法 JSON", true); return; }
      try {
        const data = await post("/api/mcp/call", { tool, params });
        show(metaBanner(data.payload) + pre(data.payload) + codeHelpHtml(JSON.stringify(data.payload)));
      } catch (exc) {
        const payload = exc.payload || { error: exc.message };
        show(metaBanner(payload) + pre(payload) + codeHelpHtml(JSON.stringify(payload)));
        throw exc;
      }
    });
  }

  if (action === "data-crosscheck") {
    const code = $("#data-code").value.trim();
    const date = $("#data-date").value.trim();
    const query = new URLSearchParams({ code, report_date: date });
    return runAction(button, async () => {
      const data = await api(`/api/crosscheck?${query}`);
      show(pre(data.payload) + codeHelpHtml(JSON.stringify(data.payload)));
    });
  }

  if (action === "data-risk") {
    const code = $("#data-code").value.trim();
    return runAction(button, async () => {
      const data = await api(`/api/risk?${new URLSearchParams({ code, limit: "100" })}`);
      show(table(data.events || [], null, {
        sort: false, note: "顺序由服务端决定：事件日期最新在前。",
      }));
    });
  }

  if (action === "crawler-run") {
    if (!guardReadonly()) return;
    return runAction(button, async () => {
      const body = {
        task: $("#crawler-task").value,
        days: Number($("#crawler-days").value || 7),
        codes: ($("#crawler-codes").value || "").split(/[,\s]+/).filter(Boolean),
      };
      const data = await post("/api/crawler/run", body);
      toast(`已提交任务 #${data.job.id}，进度会在下方实时刷新`);
      await refreshCrawlerJobs();
      startCrawlerPoll();
    });
  }

  if (action === "crawler-cancel" || action === "crawler-retry") {
    if (!guardReadonly()) return;
    const jobId = Number(button.dataset.job);
    return runAction(button, async () => {
      const suffix = action === "crawler-cancel" ? "cancel" : "retry";
      const data = await post(`/api/crawler/jobs/${jobId}/${suffix}`);
      toast(action === "crawler-cancel"
        ? `任务 #${jobId} 已请求取消，已落库的数据会保留`
        : `已重新提交任务 #${data.job.id}`);
      await refreshCrawlerJobs();
      startCrawlerPoll();
    });
  }

  if (action === "logs-query") {
    const query = new URLSearchParams({
      limit: $("#log-limit").value || "200",
      level: $("#log-level").value,
      q: $("#log-q").value,
    });
    return runAction(button, async () => {
      const data = await api(`/api/logs?${query}`);
      $("#log-rows").innerHTML = table(data.rows, null, {
        sort: false, note: "顺序由服务端决定：最新在前；要换顺序请调整上方条件后重新查询。",
      });
    });
  }
}

document.addEventListener("click", (event) => {
  const header = event.target.closest("th[data-sortable]");
  if (header) {
    sortTable(header.closest("table"), Number(header.dataset.col), header);
    return;
  }
  const jump = event.target.closest("[data-cross-route]");
  if (jump) {
    state.keepSearch = true;  // keep the query so the target route opens filtered too
    hideCrossResults();
    return;
  }
  const button = event.target.closest("[data-action]");
  if (!button) return;
  event.preventDefault();
  handleAction(button.dataset.action, button).catch((exc) => toast(exc.message || String(exc), true));
});

// Sortable headers are focusable; Enter / Space must work without a mouse.
$("#view").addEventListener("keydown", (event) => {
  const header = event.target.closest("th[data-sortable]");
  if (!header || (event.key !== "Enter" && event.key !== " ")) return;
  event.preventDefault();
  sortTable(header.closest("table"), Number(header.dataset.col), header);
});

/* --------------------------------------------------------------- routing */

const ROUTES = Object.keys(views);

function currentRoute() {
  const name = (location.hash.replace(/^#\//, "") || "dashboard").split("?")[0];
  return ROUTES.includes(name) ? name : "dashboard";
}

let rendering = false;

async function renderRoute(force = false) {
  if (rendering) return;
  rendering = true;
  const route = currentRoute();
  document.querySelectorAll("#nav a").forEach((a) => a.classList.toggle("active", a.dataset.route === route));
  const view = $("#view");
  if (force) view.innerHTML = "<p class='muted'>加载中…</p>";
  try {
    view.innerHTML = await views[route]();
    if (route === "crawler") startCrawlerPoll(); else stopCrawlerPoll();
  } catch (exc) {
    stopCrawlerPoll();
    view.innerHTML = `<h2>加载失败</h2><p class="err">${esc(exc.message || String(exc))}</p>
      ${codeHelpHtml(exc.message)}<div class="row"><button type="button" class="primary" data-action="refresh-view">重试</button></div>`;
  } finally {
    rendering = false;
  }
}

function fmtStamp(value) {
  if (!value) return "—";
  return String(value).replace("T", " ").slice(0, 16);
}

function fmtDuration(seconds) {
  const s = Math.max(0, Math.round(Number(seconds) || 0));
  const d = Math.floor(s / 86400), h = Math.floor((s % 86400) / 3600), m = Math.floor((s % 3600) / 60);
  if (d) return `${d}天 ${h}小时`;
  if (h) return `${h}小时 ${m}分`;
  if (m) return `${m}分 ${s % 60}秒`;
  return `${s}秒`;
}

window.addEventListener("hashchange", () => {
  const search = $("#search");
  if (search.value && !state.keepSearch) { search.value = ""; applySearch(); }
  state.keepSearch = false;
  renderRoute();
});
$("#connect").addEventListener("click", () => connect().then((ok) => { if (ok) renderRoute(true); }));
$("#token").addEventListener("keydown", (event) => {
  if (event.key === "Enter") { event.preventDefault(); $("#connect").click(); }
});

/* ------------------------------------------- search / export / theme / help */

$("#search").addEventListener("input", applySearch);
$("#search").addEventListener("keydown", (event) => {
  if (event.key === "Enter") { event.preventDefault(); scanRoutes(); }
});
$("#export").addEventListener("click", exportView);
$("#export-xlsx").addEventListener("click", exportViewXlsx);
$("#theme").addEventListener("click", cycleTheme);
$("#shortcut-button").addEventListener("click", openHelp);
$("#shortcuts").addEventListener("close", () => $("#shortcut-button").focus());

// Views swap innerHTML wholesale, so re-apply the filter whenever content lands.
new MutationObserver(applySearch).observe($("#view"), { childList: true, subtree: true });

window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => {
  if (state.theme === "auto") applyTheme("auto");
});

document.addEventListener("keydown", (event) => {
  const mod = event.ctrlKey || event.metaKey;
  const key = event.key.toLowerCase();
  if (mod && key === "k") { event.preventDefault(); $("#search").focus(); $("#search").select(); return; }
  if (mod && key === "e") {
    event.preventDefault();
    if (event.shiftKey) exportViewXlsx(); else exportView();
    return;
  }
  if (mod && key === "j") { event.preventDefault(); cycleTheme(); return; }
  if (event.key === "Escape") {
    if ($("#shortcuts").open) return;
    const search = $("#search");
    if (search.value) { search.value = ""; applySearch(); }
    hideCrossResults();
    if (document.activeElement === search) search.blur();
    $("#toast").style.display = "none";
    return;
  }
  if (isTyping(event) || mod) return;
  if (event.key === "/") { event.preventDefault(); $("#search").focus(); return; }
  if (event.key === "?") { event.preventDefault(); openHelp(); return; }
  if (event.altKey && /^[1-9]$/.test(event.key)) {
    const route = ROUTES[Number(event.key) - 1];
    if (route) { event.preventDefault(); location.hash = `#/${route}`; }
  }
});

renderHelp();
applyTheme(state.theme);
$("#token").value = state.token;
connect(true).then(() => renderRoute());
</script>
