name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONIOENCODING: utf-8
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # The offline suite touches no public endpoint: conftest.py points Redis
      # at an unroutable port, chdirs into a temp dir and leaves TICKHUB_LIVE
      # unset. Heavy data-source extras (akshare, baostock, ...) are not needed,
      # but the admin API integration tests import `tickhub_cn.admin_api` at
      # collection time (`admin`), and the cninfo-notes regression tests parse a
      # real PDF (`notes` = pypdf + pdfminer.six) — both extras ARE required.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,admin,notes]"

      - name: Import smoke test
        run: python -c "import tickhub_cn, tickhub_cn.datasources; from tickhub_cn.mcp.server import tool_count; assert tool_count() == 149, tool_count()"

      - name: Run tests
        run: python -m pytest

  catalog:
    name: tool catalogue is current
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Regenerate the skill catalogue
        run: python scripts/gen_tool_catalog.py --format skill --out skills/tickhub-cn/references/tools.md

      - name: Fail when the committed catalogue drifted
        run: git diff --exit-code -- skills/tickhub-cn/references/tools.md
