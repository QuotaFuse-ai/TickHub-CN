name: Publish to PyPI

# Manual only: nothing is uploaded until someone explicitly dispatches this
# workflow. Uses GitHub OIDC Trusted Publishing; the PyPI/TestPyPI publisher is
# configured on the index side (owner QuotaFuse-ai, repo TickHub-CN, this file,
# environments pypi / testpypi). See the "发布" section of README.md.
on:
  workflow_dispatch:
    inputs:
      repository:
        description: "Target index"
        type: choice
        options:
          - testpypi
          - pypi
        default: testpypi

permissions:
  contents: read

jobs:
  build:
    name: build and check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: upload to ${{ inputs.repository }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: ${{ inputs.repository }}
      url: ${{ inputs.repository == 'pypi' && 'https://pypi.org/p/tickhub-cn' || 'https://test.pypi.org/p/tickhub-cn' }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: ${{ inputs.repository == 'pypi' && 'https://upload.pypi.org/legacy/' || 'https://test.pypi.org/legacy/' }}
