[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tickhub-cn"
version = "1.0.1"
description = "TickHub-CN (A股数据枢纽): A-share data MCP server, CLI and local import library"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "QuotaFuse" }]
keywords = ["a-share", "mcp", "stock", "market-data", "tickhub"]
classifiers = [
  "Intended Audience :: Developers",
  "Environment :: Console",
  "Natural Language :: Chinese (Simplified)",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent",
  "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
  "mcp>=1.9",
  "requests>=2.31",
  "typer>=0.12",
  "toml>=0.10",
  "python-dotenv>=1.0",
  "redis>=5.0",
  "apscheduler>=3.10",
  "tenacity>=8.2",
  "pydantic>=2.5",
]

[project.optional-dependencies]
admin = ["fastapi>=0.110", "uvicorn>=0.27"]
db = ["sqlalchemy>=2.0", "pymysql>=1.1", "psycopg2-binary>=2.9"]
sources = ["akshare>=1.12", "baostock>=0.8", "xlrd>=2.0", "openpyxl>=3.1", "pandas>=2.0"]
# mootdx pins httpx<0.26 and tenacity<9, which breaks a2a-sdk/litellm in a shared
# venv; only stock_f10_tips imports it at call time, so it stays opt-in.
sources-legacy = ["mootdx>=0.11"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "pyyaml>=6.0"]
all = ["tickhub-cn[admin,db,sources]"]
docx = ["python-docx>=1.1"]
# cninfo_financial_notes(extract=true) reads the annual-report PDF; pypdf is the
# fast path, pdfminer.six ships the Adobe-GB1 CMaps that legacy CID fonts need,
# and a system pdftotext is the last resort. Without any of them it stays a locator.
notes = ["pypdf>=4.0", "pdfminer.six>=20231228"]

[project.scripts]
th-cn = "tickhub_cn.cli.main:main"

[project.urls]
Homepage = "https://github.com/QuotaFuse-ai/TickHub-CN"
Repository = "https://github.com/QuotaFuse-ai/TickHub-CN"
Releases = "https://github.com/QuotaFuse-ai/TickHub-CN/releases"
Issues = "https://github.com/QuotaFuse-ai/TickHub-CN/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

# The Shenwan host omits its TLS intermediate; sw_industry merges this vendored
# certificate into certifi rather than disabling verification.
[tool.setuptools.package-data]
tickhub_cn = ["data/*.pem"]

# The console page is a single file outside the package; `th-cn admin serve`
# resolves it from sys.prefix/share when it is not running from a checkout.
[tool.setuptools.data-files]
"share/tickhub-cn/web/admin" = ["web/admin/index.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
markers = [
  "live: tests that touch the public internet",
  "contract: MCP API contract tests",
  "slow: crawler, daemon and supervisor tests",
]
